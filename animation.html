<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            height: 100vh;
            display: flex;
            /* justify-content: center;
            align-items: center; */
            background-color:lightgrey;
        }
        .box{
            position: relative;
            height: 300px;
            width: 300px;
            background-color: rgb(37, 16, 56);
            border-radius: 40px;
            border: 1px solid black;
        }
        .circle{
            position: absolute;
            height: 70px;
            width: 70px;
            background:linear-gradient(180deg yellow rgb(0,10,78));
            border-radius: 50%;
            background-color: palevioletred;
            border: 4px solid white;
            animation: move 4s infinite linear;
        }
        @keyframes move {
            0%{
                top: 0;
                left: 0;
            }
            25%{
                top: 0;
                left: 240px;
            }
            50%{
                top: 240px;
                left: 240px;
            }
            75%{
                top: 240px;
                left: 0;
            }
            100%{
                top: 0;
                left: 0;
            }
            
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="circle"></div>
</body>
</html>
