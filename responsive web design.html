<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            gap: 10px;
            width: 100%;

            height: 100vh;
            grid-template-areas: 
            "header header header header header header"
            "main1 main1 main2 main2 main3 main3"
            "footer1 footer1 footer1 footer2 footer2 footer2";

        }
        
        .container div{
            background-color: red;
        }
        .Box-1{grid-area: header;}
        .Box-2{grid-area: main1;}
        .Box-3{grid-area: main2;}
        .Box-4{grid-area: main3;}
        .Box-5{grid-area: footer1;}
        .Box-6{grid-area: footer2;}   
        
        @media(max-width:500px){
        .container{grid-template-areas:
            "header"
            "main1"
            "main2"
            "main3"
            "footer1"
            "footer2"
        ;}
    }
        </style>
</head>
<body>
    <div class="container">
    <div class="Box-1">1</div>
    <div class="Box-2">2</div>
    <div class="Box-3">3</div>
    <div class="Box-4">4</div>
    <div class="Box-5">5</div>
    <div class="Box-6">6</div>
    </div>
</body>
</html>
