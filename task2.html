<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=  , initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin:0;
            padding:20px;
            background-color: #2f3154;
        }
        .container{
            display:grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(3,1fr);
            gap:10px;
            width: 500px;
            height: 450px;
        }
        .box {
            border-radius: 0px;
            justify-content: center;
            align-content: center;
            font-size: larger;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            gap: 10px;
        }
        .box1{
            grid-row: 1/4;
            background-color: lightgreen;

        }
        .box2{
            grid-column: 2/4;
            background-color: lightgreen;
        }
        .box3{
            grid-column: 4/5;
            background-color: red;
        }
        .box4{
            grid-column: 2/3;
            grid-row: 2/3;
            background-color: orange;
        }
        .box5{
            grid-column: 3/4;
            grid-row: 2/3;
            background-color: red;
        }
        .box6{
            grid-column: 2/3;
            grid-row: 3/4;
            background-color: red;
        }
        .box7{
            grid-column: 3/4;
            grid-row: 3/4;
            background-color: orange;
        }
        .box8{
            grid-column: 4/5;
            grid-row: 2/4;
            background-color: lightgreen;
        }


    </style>
</head>
<body>
    <div class="container"style="text-align:center;">
        <div class="box  box1">1</div>
        <div class="box  box2">2</div>
        <div class="box  box3">4</div>
        <div class="box  box4">3</div>
        <div class="box  box5">6</div>
        <div class="box  box6">5</div>
        <div class="box  box7">8</div>
        <div class="box  box8">7</div>
        </div>
</body>
</html>
